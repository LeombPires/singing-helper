<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singing helper</title>
<meta name="theme-color" content="#141012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Singing helper">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, a small instrument on a table
   IDEA: the keybed of an upright piano, lid open, red felt strip above the keys
   PICTURE: the keyboard itself, large, in a black lacquer case
   COLOUR and TYPE: lacquer black, ivory keys, felt red accent; Fraunces for the name, Inter for labels
   LAYOUT: modest title, the keyboard filling the width, autoplay control under it */
:root{color-scheme:light dark;
  --bg:light-dark(#efe9df,#16110e);--ink:light-dark(#221a14,#efe6da);--muted:light-dark(#6f6255,#a8998a);
  --case:#141012;--case-edge:#2b2427;--felt:#9b1d24;--ivory:#fbf7ee;--ivory-down:#e7dcc6;--ebony:#16131a;--ebony-down:#3a3340;
  --accent:#c4262f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:980px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,12px)}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(32px,6vw,48px);line-height:1.05;margin:0 0 22px;text-wrap:balance}


/* Caixa do piano: laca preta com a faixa de feltro vermelho por cima das teclas */
.case{background:linear-gradient(180deg,#221c1f,var(--case) 40%);border:1px solid var(--case-edge);border-radius:18px;
  padding:18px clamp(8px,2vw,18px) clamp(14px,2.4vw,22px);box-shadow:0 24px 40px -24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.now{display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:#d9cfc2;padding:0 6px 12px;font-size:14px}
.now b{font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1;color:#fff;font-weight:600;min-width:2.4em}
.felt{height:10px;background:linear-gradient(180deg,#b3252d,var(--felt));border-radius:3px 3px 0 0}

/* Teclas: da tónica à tónica de cima (8 ou 9 brancas, conforme a escala), pretas por cima. --w = número de brancas */
.keys{position:relative;height:clamp(200px,42vw,320px);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;--w:8;
  touch-action:none;user-select:none;-webkit-user-select:none}
.key{position:relative;border:0;padding:0 0 12px;font:inherit;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.white{background:linear-gradient(180deg,#ebe3d3 0,var(--ivory) 10%,var(--ivory) 88%,#e9dfcb);color:#6d5f50;border-radius:0 0 8px 8px;
  box-shadow:inset 0 -6px 0 #d8ccb5,0 2px 0 rgba(0,0,0,.4);font-weight:600;font-size:15px;transition:transform .05s}
.white.down{background:var(--ivory-down);box-shadow:inset 0 -2px 0 #cdbfa5,0 1px 0 rgba(0,0,0,.4);transform:translateY(2px);color:var(--accent)}
.black{position:absolute;top:0;height:60%;width:calc(100% / var(--w) * .6);z-index:2;background:linear-gradient(180deg,#2c2730,var(--ebony) 70%,#0c0a0e);
  border-radius:0 0 6px 6px;color:#bfb4c6;font-size:12px;font-weight:500;padding-bottom:10px;
  box-shadow:inset 0 -8px 0 #000,inset 1px 0 0 rgba(255,255,255,.08),0 3px 4px rgba(0,0,0,.45);transition:transform .05s}
.black.down{background:var(--ebony-down);box-shadow:inset 0 -3px 0 #000,0 1px 2px rgba(0,0,0,.4);transform:translateY(2px);color:#fff}
.key:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.key .kb{display:block;font-size:11px;font-weight:400;opacity:.55;margin-top:2px}
.key span{display:flex;flex-direction:column;align-items:center;line-height:1.1;pointer-events:none}
/* Notas da escala: um ponto vermelho por cima do nome (o espaço do ponto existe em todas, para os nomes ficarem alinhados) */
.key span::before{content:"";width:7px;height:7px;border-radius:50%;margin-bottom:6px}
.key.in-scale span::before{background:var(--accent)}

/* Controlos por baixo */
.controls{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;margin-top:22px}
.repeat{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 22px 10px 16px;border-radius:99px;
  border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
.repeat svg{width:22px;height:22px}
.repeat[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.repeat:disabled{opacity:.4;cursor:not-allowed}
.repeat:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.status{color:var(--muted);font-size:15px}
/* Escala: − C major + */
.octave{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.octave button{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);
  font:600 24px/1 Inter,system-ui,sans-serif;cursor:pointer;display:grid;place-items:center}
.octave button:disabled{opacity:.3;cursor:not-allowed}
.octave button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.octave output{min-width:6.4em;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.octave output b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;line-height:1.1}
.octave output small{color:var(--muted);font-size:13px}
@media (max-width:600px){.octave{margin-left:0}}
/* Nota que o autoplay está a tocar: fica marcada durante os 5 segundos */
.white.on{background:var(--ivory-down);color:var(--accent);box-shadow:inset 0 -6px 0 var(--accent),0 2px 0 rgba(0,0,0,.4)}
.black.on{background:var(--ebony-down);color:#fff;box-shadow:inset 0 -6px 0 var(--accent),0 3px 4px rgba(0,0,0,.45)}
@media (hover:none){.key .kb{display:none}}
@media (prefers-reduced-motion:reduce){.key{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Singing helper</h1>

  <div class="case">
    <div class="now"><span>Last note</span><b id="now" aria-live="polite">–</b></div>
    <div class="felt"></div>
    <div class="keys" id="keys"></div>
  </div>

  <div class="controls">
    <button class="repeat" id="auto" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      <span id="autoLabel">Autoplay</span>
    </button>
    <span class="status" id="status" aria-live="polite"></span>
    <div class="octave" role="group" aria-label="Scale">
      <button id="rootDown" aria-label="Scale down a semitone">−</button>
      <output id="rootLabel" aria-live="polite"><b>C major</b><small>C4–C5</small></output>
      <button id="rootUp" aria-label="Scale up a semitone">+</button>
    </div>
  </div>
</main>

<script>
{
// As notas trabalham com números MIDI: 60 = C4 (o C central do piano), cada semitom soma 1
const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const isBlack = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
const freqOf = m => 440 * 2 ** ((m - 69) / 12);
const nameOf = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const pitchOf = m => NAMES[m % 12];

// Escala maior a partir da tónica: tom, tom, meio-tom, tom, tom, tom, meio-tom
const SCALE = [0, 2, 4, 5, 7, 9, 11, 12];
// − e + sobem e descem a escala meio-tom de cada vez. Vai de C2 maior a C6 maior
const ROOT_MIN = 36, ROOT_MAX = 84;
let root = 60;
// Teclas do computador: A W S E D F T G Y H U J K tocam da tónica até à tónica de cima
const KB = ['a', 'w', 's', 'e', 'd', 'f', 't', 'g', 'y', 'h', 'u', 'j', 'k'];

// ============ TECLADO ============
// Mostra da tónica até à tónica de cima; se uma ponta calhar numa preta, acrescenta a branca ao lado para o piano não começar nem acabar numa preta
const keysEl = document.getElementById('keys');
function drawKeys() {
  let lo = root, hi = root + 12;
  if (isBlack(lo)) lo--;
  if (isBlack(hi)) hi++;
  const whites = [];
  for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const W = whites.length;
  keysEl.style.gridTemplateColumns = `repeat(${W}, minmax(0, 1fr))`;
  keysEl.style.setProperty('--w', W);
  let html = '', wi = 0;
  for (let m = lo; m <= hi; m++) {
    const off = m - root;
    const inScale = SCALE.includes(off);
    const kb = off >= 0 && off <= 12 ? `<small class="kb">${KB[off].toUpperCase()}</small>` : '';
    const label = `<span>${pitchOf(m)}${kb}</span>`;
    const cls = `key ${isBlack(m) ? 'black' : 'white'}${inScale ? ' in-scale' : ''}`;
    if (!isBlack(m)) { wi++; html += `<button class="${cls}" data-m="${m}" aria-label="${nameOf(m)}">${label}</button>`; }
    // a preta fica centrada na junta entre a branca anterior e a seguinte
    else html += `<button class="${cls}" data-m="${m}" style="left:calc(100% / ${W} * ${wi} - (100% / ${W} * .3))" aria-label="${nameOf(m)}">${label}</button>`;
  }
  keysEl.innerHTML = html;
}

// ============ SOM (Web Audio, sem ficheiros) ============
// Som de piano simples: algumas harmónicas que se apagam depressa, as agudas mais depressa
let ctx = null, master = null;
function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createDynamicsCompressor();
    master.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
// hold = segundos que a nota fica a soar (o autoplay usa notas longas para dar tempo de cantar)
// Sem hold a nota soa como com o pedal de sustain carregado: apaga-se devagar ao longo de uns 8 segundos
const SUSTAIN = 8;
const voices = [];
function play(m, hold) {
  const c = audio(), t = c.currentTime, f = freqOf(m);
  const len = hold || SUSTAIN;
  const out = c.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(0.5, t + 0.006);
  out.gain.exponentialRampToValueAtTime(0.2, t + 0.35);
  if (hold) {
    // Fica num nível estável e apaga-se só no fim
    out.gain.exponentialRampToValueAtTime(0.14, t + len - 0.4);
    out.gain.exponentialRampToValueAtTime(0.001, t + len);
  } else {
    // Pedal: desce devagar e só no fim se apaga de vez
    out.gain.exponentialRampToValueAtTime(0.06, t + len * 0.6);
    out.gain.exponentialRampToValueAtTime(0.001, t + len);
  }
  out.connect(master);
  const oscs = [[1, 1], [2, .45], [3, .22], [4, .12], [5, .06]].map(([h, v]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = h === 1 ? 'triangle' : 'sine';
    o.frequency.value = f * h * (1 + (h - 1) * 0.0008);   // leve desafinação das harmónicas, soa menos a apito
    g.gain.setValueAtTime(v, t);
    // As harmónicas descem até um nível baixo em vez de desaparecerem, para a nota continuar a soar
    if (hold) g.gain.exponentialRampToValueAtTime(Math.max(v * 0.25, 0.01), t + 1.2 / h);
    else g.gain.exponentialRampToValueAtTime(Math.max(v * 0.15, 0.006), t + 3 / h);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + len + 0.1);
    return o;
  });
  if (hold) voices.push({ out, oscs });
}
// Cortar a nota longa que está a tocar (ao avançar, ao tocar outra tecla ou ao parar o autoplay)
function stopHeld() {
  if (!ctx) return;
  const t = ctx.currentTime;
  while (voices.length) {
    const { out, oscs } = voices.pop();
    try {
      out.gain.cancelScheduledValues(t);
      out.gain.setValueAtTime(out.gain.value, t);
      out.gain.linearRampToValueAtTime(0, t + 0.08);
      oscs.forEach(o => o.stop(t + 0.1));
    } catch (e) {}
  }
}

// ============ TOCAR E MOSTRAR ============
const nowEl = document.getElementById('now');
const autoBtn = document.getElementById('auto');
const autoLabel = document.getElementById('autoLabel');
const statusEl = document.getElementById('status');
let last = null;

function flash(m) {
  const k = keysEl.querySelector(`[data-m="${m}"]`);
  if (!k) return;
  k.classList.add('down');
  clearTimeout(k._t);
  k._t = setTimeout(() => k.classList.remove('down'), 180);
}
function hit(m) {
  // Com o autoplay ligado, tocar numa nota da escala faz o autoplay continuar a partir dela;
  // uma nota fora da escala toca por cima sem mexer no autoplay
  if (autoTimer && SCALE.includes(m - root)) { autoIdx = SCALE.indexOf(m - root); autoStep(); return; }
  last = m;
  try { play(m); } catch (e) {}
  flash(m);
  nowEl.textContent = nameOf(m);
}

// pointerdown em vez de click: o som sai logo ao tocar, sem esperar que se levante o dedo
keysEl.addEventListener('pointerdown', e => {
  const k = e.target.closest('.key');
  if (!k) return;
  e.preventDefault();
  hit(Number(k.dataset.m));
});
// Enter / espaço quando a tecla está selecionada com o teclado
keysEl.addEventListener('keydown', e => {
  const k = e.target.closest('.key');
  if (k && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); hit(Number(k.dataset.m)); }
});
// Teclado do computador: A W S E D F T G Y H U J K, e Z / X para descer / subir a escala
document.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input')) return;
  const key = e.key.toLowerCase();
  if (key === 'z') { e.preventDefault(); setRoot(root - 1); return; }
  if (key === 'x') { e.preventDefault(); setRoot(root + 1); return; }
  const off = KB.indexOf(key);
  if (off >= 0) { e.preventDefault(); hit(root + off); }
});

// ============ AUTOPLAY ============
// Escala maior em vai-e-vem: sobe da tónica à tónica de cima e volta a descer, sem repetir as pontas; 5 segundos por nota
const NOTE_SECONDS = 5;
// autoIdx = posição na escala da próxima nota a tocar; autoCur = a que está a tocar agora
let autoTimer = null, autoIdx = 0, autoCur = 0, autoDir = 1;
function mark(m) {
  keysEl.querySelectorAll('.on').forEach(k => k.classList.remove('on'));
  if (m !== null) keysEl.querySelector(`[data-m="${m}"]`)?.classList.add('on');
}
// Toca a nota atual e marca a seguinte para daqui a 5 segundos
function autoStep() {
  clearTimeout(autoTimer);
  stopHeld();
  autoCur = autoIdx;
  const m = root + SCALE[autoCur];
  try { play(m, NOTE_SECONDS); } catch (e) {}
  mark(m);
  last = m;
  nowEl.textContent = nameOf(m);
  if (autoCur === SCALE.length - 1) autoDir = -1;
  if (autoCur === 0) autoDir = 1;
  statusEl.textContent = autoDir > 0 ? 'Going up' : 'Going down';
  autoIdx = autoCur + autoDir;
  autoTimer = setTimeout(autoStep, NOTE_SECONDS * 1000);
}
function setAuto(on) {
  autoBtn.setAttribute('aria-pressed', on);
  autoLabel.textContent = on ? 'Stop autoplay' : 'Autoplay';
  if (on) {
    // Começa na última nota tocada se estiver dentro da escala (uma de fora passa para a nota da escala logo acima), senão na tónica, e sobe
    const off = last === null ? -1 : last - root;
    autoIdx = off >= 0 && off <= 12 ? SCALE.findIndex(x => x >= off) : 0;
    autoDir = autoIdx === SCALE.length - 1 ? -1 : 1;
    autoTimer = 1;   // marca como ligado antes do primeiro passo
    autoStep();
  } else {
    clearTimeout(autoTimer); autoTimer = null;
    stopHeld(); mark(null);
    statusEl.textContent = '';
  }
}
autoBtn.addEventListener('click', () => setAuto(autoBtn.getAttribute('aria-pressed') !== 'true'));

// ============ SUBIR / DESCER A ESCALA ============
const rootDown = document.getElementById('rootDown'), rootUp = document.getElementById('rootUp');
const rootLabel = document.getElementById('rootLabel');
function setRoot(n) {
  n = Math.max(ROOT_MIN, Math.min(ROOT_MAX, n));
  if (n === root) return;
  root = n;
  drawKeys();
  showRoot();
  // Com o autoplay ligado, continua no mesmo grau da escala, já na escala nova
  if (autoTimer) { autoIdx = autoCur; autoStep(); }
}
function showRoot() {
  rootLabel.querySelector('b').textContent = `${pitchOf(root)} major`;
  rootLabel.querySelector('small').textContent = `${nameOf(root)}–${nameOf(root + 12)}`;
  rootDown.disabled = root <= ROOT_MIN;
  rootUp.disabled = root >= ROOT_MAX;
}
rootDown.addEventListener('click', () => setRoot(root - 1));
rootUp.addEventListener('click', () => setRoot(root + 1));
drawKeys();
showRoot();

// Funcionar sem internet depois da primeira visita (só na versão instalável)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
}
</script>
</body>
</html>
